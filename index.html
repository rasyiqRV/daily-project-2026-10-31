<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
    <div class="app">
        <header>
            <h1>🍅 Pomodoro Timer</h1>
            <p class="subtitle">Fokus. Istirahat. Ulangi.</p>
        </header>

        <div class="timer-container">
            <div class="mode-tabs">
                <button class="tab active" data-mode="pomodoro">Pomodoro</button>
                <button class="tab" data-mode="shortBreak">Istirahat Pendek</button>
                <button class="tab" data-mode="longBreak">Istirahat Panjang</button>
            </div>

            <div class="timer-display">
                <svg class="progress-ring" viewBox="0 0 260 260">
                    <circle class="progress-ring__bg" cx="130" cy="130" r="120" />
                    <circle class="progress-ring__circle" cx="130" cy="130" r="120" />
                </svg>
                <div class="time" id="time">25:00</div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Mulai</button>
                <button id="resetBtn" class="btn btn-secondary">Reset</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-value" id="completedCount">0</span>
                <span class="stat-label">Sesi Selesai</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="totalTime">0m</span>
                <span class="stat-label">Total Fokus</span>
            </div>
        </div>

        <div class="settings-panel">
            <h3>⚙️ Pengaturan</h3>
            <div class="setting-row">
                <label for="pomodoroTime">Durasi Pomodoro (menit)</label>
                <input type="number" id="pomodoroTime" value="25" min="1" max="120">
            </div>
            <div class="setting-row">
                <label for="shortBreakTime">Istirahat Pendek (menit)</label>
                <input type="number" id="shortBreakTime" value="5" min="1" max="30">
            </div>
            <div class="setting-row">
                <label for="longBreakTime">Istirahat Panjang (menit)</label>
                <input type="number" id="longBreakTime" value="15" min="1" max="60">
            </div>
            <div class="setting-row">
                <label for="longBreakInterval">Istirahat Panjang Setiap (sesi)</label>
                <input type="number" id="longBreakInterval" value="4" min="2" max="10">
            </div>
            <div class="setting-row">
                <label for="autoStart">Mulai Otomatis</label>
                <input type="checkbox" id="autoStart">
            </div>
        </div>

        <div class="task-section">
            <h3>📝 Daftar Tugas</h3>
            <div class="task-input-row">
                <input type="text" id="taskInput" placeholder="Tambah tugas baru..." maxlength="100">
                <button id="addTaskBtn" class="btn btn-small">+</button>
            </div>
            <ul id="taskList" class="task-list"></ul>
        </div>

        <footer>
            <p>Dibuat dengan ❤️ — Daily Project Builder 2026-10-31</p>
        </footer>
    </div>

    <audio id="alarmSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <script src="app.js"></script>
</body>
</html>
